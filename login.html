<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Saung Inspirasi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1E140F" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Saung Inspirasi" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script>
  if (sessionStorage.getItem("role")) location.replace("index.html");
</script>
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <main class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <h1>Saung Inspirasi</h1>
        <p>Monitoring stok bahan kafe</p>
      </div>

      <form id="login-form" autocomplete="off">
        <label class="modal-label" for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Masukkan password" />
        <button type="submit" class="btn btn-primary btn-full-solid">Masuk sebagai Admin</button>
      </form>

      <div class="login-divider"><span>atau</span></div>

      <button id="btn-monitor" type="button" class="btn btn-outline btn-full-solid">Masuk sebagai Monitoring</button>
    </div>
  </main>
  <script>
    const ADMIN_PASSWORD = "111";

    function showToast(message, type = "error") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function masuk(role) {
      sessionStorage.setItem("role", role);
      location.replace("index.html");
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("login-password");
      if (input.value === ADMIN_PASSWORD) {
        masuk("admin");
      } else {
        showToast("Password salah");
        input.value = "";
        input.focus();
      }
    });

    document.getElementById("btn-monitor").addEventListener("click", () => masuk("monitor"));
    document.getElementById("login-password").focus();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker gagal:", e));
      });
    }
  </script>
</body>
</html>
